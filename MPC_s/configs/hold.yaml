# Task: hold a fixed target position and reject whatever small disturbances
# show up (model mismatch, numerical noise) -- the simplest possible test of
# the control loop. Good first run: if this doesn't track cleanly, nothing
# else will either.
#
# q_pos/q_vel (2026-09-27): retuned from q_pos=15/q_vel=6 -- that combination
# produced an actual closed-loop task-space stiffness of only Kp~=[1.9, 0.5]
# N/m at this posture (computed via tools/solve_task_space_gain.py), 50-100x
# below what the project's own original stage report validated as workable
# against real stiction (see original_implementation.md Finding 2). q_vel=0
# (the report's own Section 4.1 finding: this decouples stiffness from
# damping, letting q_pos alone set Kp) and q_pos solved for a target |L|
# (the report's loop-gain-delay stability metric) of 0.45 -- matching, not
# exceeding, the level configs/payload.yaml already ran at unincident after
# restoring the box-QP (implementation_fix.md). Resulting Kp~=[49, 12.7] N/m,
# Kd~=[4.45, 1.15] Ns/m. This is a sim-verified, evidence-based starting
# point, NOT a hardware-validated final gain -- follow docs/02_tuning_guide.md
# section 3 step 5 (one small increment at a time) before trusting it at full
# authority on real hardware.
#
# NOTE on robot.posture_q_rad/sim_home_q_rad below: the operating pose has to
# be well away from a singularity of the x-z Jacobian. Near one, there is a
# physical direction the arm essentially cannot move in from that
# configuration, which makes any push/payload disturbance along that
# direction nearly invisible -- the controller looks like it is rejecting the
# disturbance when in fact the arm simply cannot respond. All four configs
# share the same well-conditioned pose; check any pose of your own with
# tools/check_circle_workspace.py before using it.

controller:
  dt: 0.01
  horizon: 25
  q_pos: 11293.6   # cost weight on position error (see note above: solved for target |L|=0.45)
  q_vel: 0.0       # cost weight on velocity error (0: decouples stiffness from damping)
  r: 0.15          # cost weight on control effort
  # residual-acceleration clamp [m/s^2]. Raised from 8 alongside the retune
  # above: at the new, much stiffer q_pos, a disturbance response can
  # naturally need up to ~50 m/s^2 (measured on configs/payload.yaml's
  # sustained-force transient); 100 keeps ~2x margin over that so this box
  # constraint doesn't itself distort the response (tau_max downstream is
  # still the actuator-feasibility bound this is not meant to duplicate).
  u_max: [100.0, 100.0, 100.0]
  observer_q_d: 3.0               # observer bandwidth knob (higher = faster, noisier)
  observer_r_y: 0.0004            # observer's trust in the position measurement
  observer_d_hat_max: 15.0        # anti-windup clamp on the disturbance estimate
  # FISTA iterations/tick (2026-10-01, down from the 200 default): FISTA is
  # warm-started from the previous tick's solution, so 200 fresh iterations
  # re-solves an already-nearly-solved problem. Verified 3.8-4.1x faster
  # (isolated solve + tools/benchmark_compute.py) with no measurable
  # tracking-quality change on circle.yaml's closed-loop test -- see
  # implementation_fix.md.
  qp_iters: 50

# ---------------------------------------------------------------------------
# Task-space PID gains, used by run_pid.py ONLY. run_hardware.py ignores this
# block entirely, and run_pid.py ignores the `controller:` block above, so one
# config file drives both controllers on the same task without either of them
# reading the other's numbers.
#
# F = -(kp*e + ki*integral(e) + kd*edot), in newtons, with e in metres. Note
# that these are NOT comparable to q_pos/q_vel/r above: those are cost weights
# an LQR solve turns into a gain, these are the gain itself. See
# docs/02_tuning_guide.md for how to put the two on the same footing.
#
# i_max caps the integral BEFORE ki multiplies it, so it bounds the steady-state
# authority the integral term can ever build up. On an arm with real stiction
# that cap is the parameter that decides whether a constant disturbance is ever
# worked off at all -- if ki*i_max cannot exceed the force needed to break the
# joints loose, the arm simply stops short and stays there, however long it runs.
# f_max is the output saturation, a safety bound on the commanded force.
pid:
  # Soft gains, matching this config's role as the safe first run.
  dt: 0.01
  kp: 5.0
  ki: 0.05
  kd: 0.01
  i_max: 0.2
  f_max: [8.0, 8.0]

trajectory: {type: hold, ramp_s: 2.0}

robot:
  servo_ids: [12, 13, 14]
  torque_constant_Nm_per_A: 1.78
  current_limit_ticks: 200        # conservative; raise only after confirming stable tracking
  # Per-joint sign/offset calibration -- see docs/03_hardware_safety.md and
  # tools/calibrate_joints.py for how these were measured and how to
  # re-measure them on your own hardware.
  joint_sign: [-1, -1, -1]
  joint_offset_rad: [-1.3165, -0.1946, -1.4757]
  gravity_scale: 1.0
  # Reflected rotor/gearbox inertia (2026-09-27): the XM430-W350's own rotor
  # and gear train contribute inertia that dyn.mass_matrix(q)'s link-only
  # model (Section 2.2-derived, geometry only) does not capture. This code
  # already had the machinery for it (see run_hardware.py's own comment,
  # "identified from real hardware data") but no config ever actually set
  # it -- silently defaulting to 0.0. The value comes from the project's own
  # hardware identification (same servo, same correction): sweeping a
  # constant added to M(q)'s diagonal against an open-loop joint-3 torque
  # replay showed the 0.1s prediction RMSE fall from 137.0 deg (c=0) to
  # 2.87 deg (c=0.01) -- see original_implementation.md. Also fed to
  # SimArmBackend (must match what the controller assumes, so its own plant
  # has the inertia the controller believes it has).
  dyn_armature_kg_m2: 0.01
  tau_max_Nm: [3.5, 3.0, 2.0]
  joint_min_rad: [-1.50, -4.37, -2.16]
  joint_max_rad: [1.32, -0.95, 1.57]
  joint_barrier_gain: 4.0
  joint_barrier_margin_rad: 0.15
  startup_ramp_s: 2.0
  sim_joint_damping: [0.03, 0.02, 0.015]
  sim_home_q_rad: [0.6, -2.3493, -1.86]
  posture_q_rad: [0.6, -2.3493, -1.86]
  posture_kp: 0.02   # deliberately soft -- a much higher gain self-excites oscillation at this 100 Hz loop rate
  posture_kd: 0.005
  lambda_damping: 0.01
  move_to_start_kp: 0.10
  move_to_start_ki: 0.05
  move_to_start_kd: 0.03
  move_to_start_pos_eps_rad: 0.1
  move_to_start_vel_eps_rad_s: 0.05
  move_to_start_settle_time_s: 2.0
