# Sweep point for the step-task gain sweep (next_steps_test_plan.md item 1).
# q_pos=60339.0 solved for target |L|=0.25 via
#   tools/solve_task_space_gain.py --config configs/step.yaml --target-l 0.25
# -- everything else (r, observer tuning, robot/trajectory blocks) is IDENTICAL
# to step.yaml, so this sweep isolates q_pos as the only variable. NOT YET RUN ON
# REAL HARDWARE -- only verified not to diverge in --backend sim. See
# next_steps_test_plan.md item 1 before treating any of these as a recommendation.

controller:
  dt: 0.01
  horizon: 25
  q_pos: 60339.0
  q_vel: 0.0
  r: 8.77
  u_max: [100.0, 100.0, 100.0]
  observer_q_d: 5.0e-5
  observer_r_y: 1.0e-5
  observer_d_hat_max: 100.0
  # FISTA iterations/tick (2026-10-01): see hold.yaml's comment / implementation_fix_20261001.md.
  qp_iters: 50

# ---------------------------------------------------------------------------
# Task-space PID gains, used by run_pid.py ONLY -- see circle.yaml's comment
# for how this block relates to the controller: block above.
pid:
  dt: 0.01
  kp: 5.0
  ki: 0.05
  kd: 0.01
  i_max: 0.2
  f_max: [8.0, 8.0]

trajectory: {type: step, step_axis: x, step_amplitude_m: 0.02,
  step_move_time_s: 1.5, step_dwell_s: 5.0, step_cycles: 4}

robot:
  servo_ids: [12, 13, 14]
  torque_constant_Nm_per_A: 1.78
  current_limit_ticks: 300
  joint_sign: [-1, -1, -1]
  joint_offset_rad: [-1.3165, -0.1946, -1.4757]
  gravity_scale: 1.0
  # Reflected rotor/gearbox inertia -- see hold.yaml's comment for the full
  # reasoning (137 deg -> 2.87 deg open-loop joint-3 RMSE at this value).
  dyn_armature_kg_m2: 0.01
  tau_max_Nm: [3.5, 3.0, 2.0]
  joint_min_rad: [-1.50, -4.37, -2.16]
  joint_max_rad: [1.32, -0.95, 1.57]
  joint_barrier_gain: 4.0
  joint_barrier_margin_rad: 0.15
  startup_ramp_s: 3.0
  sim_joint_damping: [0.03, 0.02, 0.015]
  # Same well-conditioned pose as push.yaml/payload.yaml/circle.yaml.
  sim_home_q_rad: [0.6, -2.3493, -1.86]
  posture_q_rad: [0.6, -2.3493, -1.86]
  posture_kp: 0.2
  posture_kd: 0.01
  lambda_damping: 0.05
  move_to_start_kp: 0.5
  move_to_start_ki: 0.05
  move_to_start_kd: 0.03
  move_to_start_pos_eps_rad: 0.1
  move_to_start_vel_eps_rad_s: 0.5
  move_to_start_settle_time_s: 1.0
