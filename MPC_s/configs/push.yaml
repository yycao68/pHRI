# Task: hold a fixed position while the SIMULATOR injects two brief external
# pushes (cosine-ramped force pulses in x and z) -- watch the disturbance
# observer's d_hat rise to estimate each push and the controller reject it.
# This is the cleanest demonstration of why the observer exists: run
# tools/plot_traj.py's d_hat figure alongside tools/plot_push.py's error
# figure and you can see d_hat rise almost exactly when each push starts.
#
# disturbance.push only has an effect with --backend sim (lib/dynamixel_
# backend.py's SimArmBackend reads it) -- real hardware has no equivalent
# "inject an exact, repeatable, precisely-timed force" switch; a real push
# test means literally pushing the arm by hand.
#
# Same controller/observer gains as hold.yaml (this task is still fundamentally
# a hold task, just with a disturbance added), same corrected pose as
# circle.yaml/payload.yaml.
#
# q_pos/q_vel (2026-09-27): retuned identically to hold.yaml -- see that
# file's comment for the full reasoning (solved for target |L|=0.45 via
# tools/solve_task_space_gain.py, matching configs/payload.yaml's already-
# deployed, sim-verified-stable level).

controller:
  dt: 0.01
  horizon: 25
  q_pos: 11293.6
  q_vel: 0.0
  r: 0.15
  # Raised from 8: at the new, much stiffer q_pos this bound was found to
  # bind DURING the push transient (peak error 303mm vs 103mm at a wider
  # bound, same disturbance) -- see implementation_fix.md. 100 keeps ~2x
  # margin over the largest naturally-occurring correction observed across
  # all four configs (~50 m/s^2, on payload.yaml's sustained-force transient).
  u_max: [100.0, 100.0, 100.0]
  observer_q_d: 3.0
  observer_r_y: 0.0004
  observer_d_hat_max: 15.0
  # FISTA iterations/tick (2026-10-01): see hold.yaml's comment / implementation_fix_20261001.md.
  qp_iters: 50

# ---------------------------------------------------------------------------
# Task-space PID gains, used by run_pid.py ONLY. run_hardware.py ignores this
# block entirely, and run_pid.py ignores the `controller:` block above, so one
# config file drives both controllers on the same task without either of them
# reading the other's numbers.
#
# F = -(kp*e + ki*integral(e) + kd*edot), in newtons, with e in metres. Note
# that these are NOT comparable to q_pos/q_vel/r above: those are cost weights
# an LQR solve turns into a gain, these are the gain itself. See
# docs/02_tuning_guide.md for how to put the two on the same footing.
#
# i_max caps the integral BEFORE ki multiplies it, so it bounds the steady-state
# authority the integral term can ever build up. On an arm with real stiction
# that cap is the parameter that decides whether a constant disturbance is ever
# worked off at all -- if ki*i_max cannot exceed the force needed to break the
# joints loose, the arm simply stops short and stays there, however long it runs.
# f_max is the output saturation, a safety bound on the commanded force.
pid:
  # A brief force pulse is a transient, so what matters here is kp and kd;
  # the integral has no time to contribute much either way.
  dt: 0.01
  kp: 10.0
  ki: 0.5
  kd: 1.0
  i_max: 0.02
  f_max: [8.0, 8.0]

trajectory: {type: hold, ramp_s: 2.0}

robot:
  servo_ids: [12, 13, 14]
  torque_constant_Nm_per_A: 1.78
  current_limit_ticks: 200
  joint_sign: [-1, -1, -1]
  joint_offset_rad: [-1.3165, -0.1946, -1.4757]
  gravity_scale: 1.0
  # Reflected rotor/gearbox inertia -- see hold.yaml's comment for the full
  # reasoning (137 deg -> 2.87 deg open-loop joint-3 RMSE at this value).
  dyn_armature_kg_m2: 0.01
  tau_max_Nm: [3.5, 3.0, 2.0]
  joint_min_rad: [-1.50, -4.37, -2.16]
  joint_max_rad: [1.32, -0.95, 1.57]
  joint_barrier_gain: 4.0
  joint_barrier_margin_rad: 0.15
  startup_ramp_s: 2.0
  sim_joint_damping: [0.03, 0.02, 0.015]
  # Well-conditioned pose (x-z Jacobian's smaller singular value ~0.15, vs
  # ~3e-5 at hold.yaml's ORIGINAL pose) -- needed here specifically because a
  # push near-singular in some direction would barely move the end-effector
  # regardless of how well the controller/observer work, making the demo
  # uninformative rather than a real test.
  sim_home_q_rad: [0.6, -2.3493, -1.86]
  posture_q_rad: [0.6, -2.3493, -1.86]
  posture_kp: 0.02
  posture_kd: 0.005
  lambda_damping: 0.01
  move_to_start_kp: 0.10
  move_to_start_ki: 0.05
  move_to_start_kd: 0.03
  move_to_start_pos_eps_rad: 0.1
  move_to_start_vel_eps_rad_s: 0.05
  move_to_start_settle_time_s: 2.0

# Two brief pushes (2s cosine-ramped pulse each): +1N in z at t=4-6s, then
# -1N in x at t=13-15s. Small enough to stay well clear of tau_max
# saturation, large enough to produce a clearly visible, recoverable
# deflection -- tune force_N up/down and re-run to get a feel for the
# relationship between disturbance size and tracking error.
disturbance:
  push:
  - t_start: 4.0
    t_end: 6.0
    force_N: [0.0, 0.0, 1.0]
  - t_start: 13.0
    t_end: 15.0
    force_N: [-1.0, 0.0, 0.0]
